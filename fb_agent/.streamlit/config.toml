# 밝은 대시보드 테마: 옅은 회색 배경 + 흰 카드 + 파랑(주)·주황(보조) 포인트. 카드 그림자·여백 등은 style.py 의 CSS 가 맡는다.
[theme]
base = "light"
primaryColor = "#2563C9"
backgroundColor = "#F3F5F9"
secondaryBackgroundColor = "#EAEFF7"
textColor = "#1F2A44"
borderColor = "#E1E7F0"
baseRadius = "12px"
buttonRadius = "10px"
showSidebarBorder = false
metricValueFontSize = "1.9rem"
metricValueFontWeight = 700
dataframeHeaderBackgroundColor = "#EEF3FB"
dataframeHeaderTextColor = "#2A3B5F"
dataframeBorderColor = "#E1E7F0"
chartCategoricalColors = ["#2E7DD7", "#F08A24", "#17A398", "#8B5CF6", "#E5484D", "#64748B", "#F5C518", "#4C8BF5"]
chartSequentialColors = ["#EEF4FD", "#DCE8FA", "#C3D8F6", "#A5C4F0", "#85AEE8", "#6597DE", "#467FD0", "#2F68BA", "#2253A0", "#183F82"]
orangeColor = "#F08A24"
blueColor = "#2E7DD7"
greenColor = "#17A398"
violetColor = "#8B5CF6"
grayColor = "#64748B"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FB"
textColor = "#1F2A44"
primaryColor = "#2563C9"
borderColor = "#E1E7F0"

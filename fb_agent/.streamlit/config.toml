# 장부 테마: 따뜻한 종이색 바탕 + 먹색 글자 + 깊은 녹색 포인트. 상태색(빨강·주황)은 포인트색과 따로 두어 '문제가 있는 곳'만 색으로 드러낸다.
# 글씨체는 Pretendard (static/fonts, OFL 라이선스)를 앱에 담아 쓴다. 카드·여백·탭 같은 모양은 style.py 의 CSS 가 맡는다.
[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"   # 개발용 Deploy 버튼 같은 것을 숨긴다

[theme]
base = "light"
primaryColor = "#1F5F4A"
backgroundColor = "#F5F2EA"
secondaryBackgroundColor = "#ECE7DB"
textColor = "#1B2A22"
borderColor = "#DDD6C6"
linkColor = "#1F5F4A"
font = "Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
codeFont = "'D2Coding', 'Noto Sans Mono', monospace"
baseFontSize = 15
baseRadius = "6px"
buttonRadius = "6px"
showSidebarBorder = false
headingFontSizes = ["1.9rem", "1.45rem", "1.15rem"]
headingFontWeights = [700, 650, 650]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 700
dataframeBorderColor = "#DDD6C6"
dataframeHeaderBackgroundColor = "#E9E3D3"
dataframeHeaderTextColor = "#2B3A31"
redColor = "#B3261E"
orangeColor = "#9A5600"
yellowColor = "#8A6A00"
greenColor = "#2E7D5B"
blueColor = "#3E6B8F"
violetColor = "#7B5A8A"
grayColor = "#66746B"
chartCategoricalColors = ["#1F5F4A", "#B8742A", "#3E6B8F", "#7B5A8A", "#B3261E", "#66746B", "#B59A2E", "#4F8A7B"]
chartSequentialColors = ["#EEF3EF", "#D8E6DE", "#BCD6C8", "#9BC0AC", "#78A892", "#568F78", "#3C765F", "#2A614C", "#1F5F4A", "#16483A"]

[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/fonts/PretendardVariable.woff2"
weight = "45 920"
style = "normal"

[theme.sidebar]
backgroundColor = "#EFEADE"
secondaryBackgroundColor = "#E7E1D2"
textColor = "#1B2A22"
primaryColor = "#1F5F4A"
borderColor = "#DDD6C6"
